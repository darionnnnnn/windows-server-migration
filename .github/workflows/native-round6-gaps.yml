name: Native round-six acceptance gaps
on:
  push:
    branches: ['codex/migration-*', dev, main]
  pull_request:
    branches: ['codex/migration-*', dev, main]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: both
        options: [both, manager, probe]
      engine:
        type: choice
        default: both
        options: [both, powershell, pwsh]
permissions:
  contents: read
jobs:
  scope:
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      reason: ${{ steps.select.outputs.reason }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        shell: pwsh
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_SUITE: ${{ inputs.suite }}
          REQUESTED_ENGINE: ${{ inputs.engine }}
        run: |
          $changed = @()
          $diffFailed = $false
          if ($env:EVENT_NAME -ne 'workflow_dispatch') {
            if ($env:EVENT_NAME -eq 'pull_request') { $base = $env:BASE_SHA; $head = $env:HEAD_SHA }
            else { $base = $env:PREVIOUS_SHA; $head = $env:GITHUB_SHA }
            if (-not $base -or $base -match '^0+$' -or -not $head) { $diffFailed = $true }
            else {
              $changed = @(& git diff --no-renames --name-only $base $head 2>$null)
              if ($LASTEXITCODE -ne 0) { $diffFailed = $true; $changed = @() }
            }
          }
          $selectorArgs = @('-NoProfile','-File','tools/Get-NativeAcceptanceScope.ps1','-EventName',$(if ($env:EVENT_NAME -eq 'workflow_dispatch') {'workflow_dispatch'} elseif ($env:EVENT_NAME -eq 'pull_request') {'pull_request'} else {'push'}),'-GapSuite',$(if ($env:REQUESTED_SUITE) {$env:REQUESTED_SUITE} else {'both'}),'-Engine',$(if ($env:REQUESTED_ENGINE) {$env:REQUESTED_ENGINE} else {'both'}))
          if ($diffFailed) { $selectorArgs += '-DiffFailed' } elseif ($changed.Count) {
            $changedJson = ConvertTo-Json -InputObject $changed -Compress
            $changedBase64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($changedJson))
            $selectorArgs += @('-ChangedPathBase64',$changedBase64)
          }
          $json = & pwsh @selectorArgs
          if ($LASTEXITCODE -ne 0 -or -not $json) { throw 'Native acceptance scope selector failed.' }
          $scope = $json | ConvertFrom-Json
          $suites = @()
          if ($scope.manager) { $suites += 'manager' }
          if ($scope.probe) { $suites += 'probe' }
          $matrix = @{include=@(foreach ($suite in $suites) { foreach ($selectedEngine in $scope.engines) { @{suite=$suite;engine=$selectedEngine} } })} | ConvertTo-Json -Compress -Depth 4
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "reason=$($scope.reason)" >> $env:GITHUB_OUTPUT
          "count=$($suites.Count * $scope.engines.Count)" >> $env:GITHUB_OUTPUT
          if ($suites.Count -eq 0) { "Scope check completed: $($scope.reason); no Manager or Probe acceptance cases were selected." >> $env:GITHUB_STEP_SUMMARY }
          else { "Selected Manager/Probe cases: $($suites -join ', '); engines: $($scope.engines -join ', '); matrix entries: $($suites.Count * $scope.engines.Count)." >> $env:GITHUB_STEP_SUMMARY }
          Write-Output "Selected native acceptance: $matrix ($($scope.reason))"
  native:
    needs: scope
    if: needs.scope.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare actual Edge driver and selected PowerShell
        shell: pwsh
        run: |
          $driver = Join-Path $env:RUNNER_TEMP 'wsm-browser-driver'
          npm install --prefix $driver --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser driver installation failed.' }
          "WSM_NODE_MODULES=$driver/node_modules" >> $env:GITHUB_ENV
          "WSM_PS_EXE=$((Get-Command '${{ matrix.engine }}').Source)" >> $env:GITHUB_ENV
      - name: Exercise the missing native journey
        id: journey
        shell: pwsh
        env:
          WSM_RUNTIME_NATIVE_TRANSPORT: '1'
          WSM_PROBE_SKIP_CLI: ${{ matrix.engine == 'powershell' && '1' || '0' }}
        run: |
          $test = if ('${{ matrix.suite }}' -eq 'manager') { 'Test-NativeWizardManagerJourney.js' } else { 'Test-NativeProbeRoles.js' }
          $log = Join-Path $env:RUNNER_TEMP 'wsm-acceptance-gap.log'
          node "tests/$test" *> $log
          $result = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($result -ne 0) { throw "Native ${{ matrix.suite }} acceptance failed (exit $result)." }
      - name: Report selected journey invocation outcome
        if: always()
        shell: pwsh
        run: |
          $outcome = '${{ steps.journey.outcome }}'
          if ($outcome -eq 'success') { "Native ${{ matrix.suite }} invocation on ${{ matrix.engine }}: completed=1, failed=0, cancelled=0, skipped=0." >> $env:GITHUB_STEP_SUMMARY }
          elseif ($outcome -eq 'failure') { "Native ${{ matrix.suite }} invocation on ${{ matrix.engine }}: completed=0, failed=1, cancelled=0, skipped=0." >> $env:GITHUB_STEP_SUMMARY }
          elseif ($outcome -eq 'cancelled') { "Native ${{ matrix.suite }} invocation on ${{ matrix.engine }}: completed=0, failed=0, cancelled=1, skipped=0." >> $env:GITHUB_STEP_SUMMARY }
          else { "Native ${{ matrix.suite }} invocation on ${{ matrix.engine }}: completed=0, failed=0, cancelled=0, skipped=1." >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round6-${{ matrix.suite }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wsm-acceptance-gap.log
          retention-days: 7
