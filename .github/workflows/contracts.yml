name: Windows PowerShell contracts
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 contracts
        shell: powershell
        run: ./tests/Test-Contracts.ps1
      - name: Windows PowerShell 5.1 collector fixtures
        shell: powershell
        run: ./tests/Test-InventoryFixture.ps1
      - name: Advanced review and fleet contracts
        shell: powershell
        run: ./tests/Test-AdvancedReview.ps1
      - name: Enterprise discovery fixtures
        shell: powershell
        run: ./tests/Test-EnterpriseDiscovery.ps1
      - name: Disabled staging adapter contracts
        shell: powershell
        run: ./tests/Test-Adapters.ps1
      - name: Payload restore cutover and crash recovery fixtures
        shell: powershell
        run: ./tests/Test-MigrationPipeline.ps1
      - name: Recovery request and IIS contracts
        shell: powershell
        run: |
          ./tests/Test-RecoveryContracts.ps1
          ./tests/Test-OperationRequests.ps1
          ./tests/Test-IisContracts.ps1
          ./tests/Test-BulkMigrationSpecs.ps1
          ./tests/Test-SourceRecovery.ps1
          ./tests/Test-MenuContracts.ps1
          ./tests/Test-RollbackRecovery.ps1
          ./tests/Test-PhysicalPaths.ps1
          ./tests/Test-FileEdges.ps1
          ./tests/Test-ArtifactKeySpool.ps1
          ./tests/Test-ArtifactRecords.ps1
          ./tests/Test-FailureDetails.ps1
          ./tests/Test-ShareContracts.ps1
          ./tests/Test-SpecScale.ps1 -Items 200
      - name: Durable activation account and installer contracts
        shell: powershell
        run: |
          ./tests/Test-ActivationRecovery.ps1
          ./tests/Test-CutoverActivationWorkflow.ps1
          ./tests/Test-ObservationWorkflow.ps1
          ./tests/Test-ServiceIdentity.ps1
          ./tests/Test-ServiceSupplement.ps1
          ./tests/Test-InstallerSafety.ps1
          ./tests/Test-ShareQuiescence.ps1
          ./tests/Test-ShareSourceWorkflow.ps1
          ./tests/Test-SourceTaskReconciliation.ps1
          ./tests/Test-CrossHostCoordination.ps1
          ./tests/Test-RemoteStorageContracts.ps1
          ./tests/Test-RemoteStorageApproval.ps1
          ./tests/Test-Qualification.ps1
          ./tests/Test-FleetExecutionBindings.ps1
          ./tests/Test-Cancellation.ps1
          ./tests/Test-CancellationWorkflow.ps1
          ./tests/Test-NativeExecution.ps1
          ./tests/Test-TaskSecurity.ps1
          ./tests/Test-TaskSecurityWorkflow.ps1
          ./tests/Test-DeltaContracts.ps1
          ./tests/Test-DeltaWorkflow.ps1
          ./tests/Test-DeltaMenu.ps1
          ./tests/Test-ConfigArtifactContracts.ps1
          ./tests/Test-ConfigArtifactWorkflow.ps1
          ./tests/Test-ConfigArtifactReview.ps1
          ./tests/Test-LabValidation.ps1
          ./tests/Test-LabReportConsumer.ps1
          ./tests/Test-PreflightCancellation.ps1
          ./tests/Test-TaskFolderJournal.ps1
      - name: Inventory ZIP trust and extraction boundaries
        shell: powershell
        run: ./tests/Test-Archive.ps1
      - name: Actual file above 4 GiB
        shell: powershell
        run: ./tests/Test-LargePayload.ps1
      - name: Noninteractive exit code contract
        shell: powershell
        run: ./tests/Test-EntryPoint.ps1
      - name: PowerShell 7 contracts
        shell: pwsh
        run: ./tests/Test-Contracts.ps1
      - name: Offline report controls
        shell: powershell
        run: ./tests/Test-Report.ps1
      - name: Fleet integration (small CI fixture)
        shell: pwsh
        run: ./tests/Test-FleetScale.ps1 -Hosts 10 -ItemsPerHost 200
      - name: Retain synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-fixture-diagnostics
          path: C:/Users/runneradmin/AppData/Local/Temp/wsm-pipeline-*/target-state/**/*.file-validation.json
          if-no-files-found: ignore
